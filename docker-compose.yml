services:
  ecosort:
    build: .
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
